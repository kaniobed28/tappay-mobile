name: tappay
description: "TapPay — contactless peer-to-peer payments (NFC + QR)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Auth
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_messaging: ^15.1.6  # FCM push (active once Firebase is configured)
  google_sign_in: ^6.2.2       # Google sign-in (active once Firebase is configured)

  # Realtime
  socket_io_client: ^3.0.2

  # State
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Contactless
  nfc_manager: ^3.5.0        # NFC read/broadcast
  mobile_scanner: ^5.2.3     # QR scanning (camera)
  qr_flutter: ^4.1.0         # QR rendering

  # Checkout
  webview_flutter: ^4.10.0   # Paystack authorization page

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# App launcher icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "branding/icon.png"
  adaptive_icon_background: "branding/icon_bg.png"
  adaptive_icon_foreground: "branding/icon_fg.png"
  remove_alpha_ios: true
  min_sdk_android: 23

# Splash screen (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#6A5BFF"
  image: branding/splash.png
  android: true
  ios: true
  android_12:
    color: "#6A5BFF"
    image: branding/splash.png
